<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Orders | Favourite Kitchen</title>
<style>*{box-sizing:border-box;margin:0}body{font:16px/1.5 system-ui,sans-serif;background:#f6f7f3;color:#1d2420}header{background:#10301f;color:#fff;padding:14px 18px;font-weight:700}main{max-width:720px;margin:auto;padding:16px}.c{background:#fff;border:1px solid #dfe3da;border-left:6px solid #f0a30a;border-radius:10px;padding:14px;margin-bottom:12px}input,select,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #b9c0b4;width:100%;margin-top:8px}button{background:#f0a30a;border:0;font-weight:700}small{color:#5c675f}</style></head>
<body><header>Favourite Kitchen orders</header>
<main><div id="lg" class="c"><label for="pw">Admin password</label><input id="pw" type="password"><button id="go">Open orders</button><p id="er" style="color:#8a1c12"></p></div><div id="ls"></div><div id="rs" class="c" style="display:none"><b>Reset a customer's password</b><input id="re" placeholder="Customer email"><input id="rp" placeholder="New temporary password (6+ characters)"><button id="rb">Reset password</button><p id="rm2"></p></div><div id="rs" class="c" style="display:none"><b>Reset a customer password</b><input id="re" type="email" placeholder="Customer email"><input id="rp" placeholder="New temporary password (6+ characters)"><button id="rb">Reset password</button><p id="rm"></p></div></main>
<script>
var pw="",ST=["New","Preparing","Out for delivery","Done","Cancelled"];
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function load(){fetch("/api/orders",{headers:{"x-admin-password":pw}}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error);return j})}).then(function(o){
  document.getElementById("lg").style.display="none";document.getElementById("rs").style.display="block";document.getElementById("rs").style.display="block";
  document.getElementById("ls").innerHTML=o.length?o.map(function(x){return '<div class="c"><b>'+x.id+'</b> · ₦'+Number(x.total).toLocaleString()+'<br><small>'+new Date(x.time).toLocaleString()+'</small><br>'+x.items.map(function(i){return i.qty+"× "+esc(i.name)}).join(", ")+'<br><b>'+esc(x.name)+'</b> · <a href="tel:'+esc(x.phone)+'">'+esc(x.phone)+'</a><br>'+esc(x.address)+(x.note?'<br><small>Note: '+esc(x.note)+'</small>':'')+(x.receipt?'<br><a href="'+x.receipt+'" target="_blank" style="font-weight:700">View payment receipt</a>':'<br><small>No receipt yet</small>')+'<select data-id="'+x.id+'">'+ST.map(function(s){return '<option'+(s===x.status?' selected':'')+'>'+s+'</option>'}).join("")+'</select></div>'}).join(""):'<p>No orders yet.</p>'}).catch(function(e){document.getElementById("er").textContent=e.message==="Wrong password."||e.message==="Not allowed."?"Wrong password.":"Could not load orders."})}
document.getElementById("go").onclick=function(){pw=document.getElementById("pw").value;load();setInterval(function(){if(pw)load()},30000)};
document.getElementById("rb").onclick=function(){var m=document.getElementById("rm");m.textContent="Working...";fetch("/api/auth",{method:"POST",headers:{"content-type":"application/json","x-admin-password":pw},body:JSON.stringify({mode:"reset",email:document.getElementById("re").value,password:document.getElementById("rp").value})}).then(function(r){return r.json().then(function(j){m.textContent=r.ok?"Done. Tell the customer to log in with the new password.":j.error})}).catch(function(){m.textContent="Could not connect."})};
document.addEventListener("change",function(e){if(e.target.dataset.id)fetch("/api/orders",{method:"PUT",headers:{"content-type":"application/json","x-admin-password":pw},body:JSON.stringify({id:e.target.dataset.id,status:e.target.value})})});
document.getElementById("rb").onclick=function(){fetch("/api/auth",{method:"POST",headers:{"content-type":"application/json","x-admin-password":pw},body:JSON.stringify({mode:"reset",email:document.getElementById("re").value,password:document.getElementById("rp").value})}).then(function(r){return r.json()}).then(function(j){document.getElementById("rm2").textContent=j.ok?"Done. Tell the customer to log in with the new password.":(j.error||"Failed")})};
</script></body></html>
